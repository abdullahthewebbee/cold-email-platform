name: quickly-caddy
version: "3.9"
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quickly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no  # no persistence needed for job queue
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: azowail/quickly:latest
    restart: unless-stopped
    expose:
      - "8000"  # internal only; Caddy proxies to this
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/quickly"
      QUICKLY_LOCAL_DISK_BACKUPS: "1"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    volumes:
      - ./backups:/app/backups

  worker:
    image: azowail/quickly:latest
    restart: unless-stopped
    command: python -m arq app.workers.worker_settings.WorkerSettings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/quickly"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    volumes:
      - ./backups:/app/backups

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    env_file: .env
    depends_on:
      - app

volumes:
  pgdata:
    external: true
    name: quickly_pgdata